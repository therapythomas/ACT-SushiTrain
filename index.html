<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Mind's Sushi Restaurant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121014;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <script>
    let brainChef;
    let customer;
    let plates = [];
    let trackProgressOffset = 0;

    let flexibilityScore = 50;
    let energyMeter = 40;

    let modeSelectScreen = true;
    let customThoughts = [];
    let inputField, submitButton, randomModeButton;
    let inGameInputField, inGameSubmitButton;
    let btnInspect, btnFightPush, btnLetGo;
    let lastSpawnTime = -300;

    let canvasWidth = 800;
    let canvasHeight = 600;
    let trackCenterX;
    let trackCenterY;
    let trackRadiusX = 240;
    let trackRadiusY = 100;
    let maxThoughtsOnTrack = 4;

    function setup() {
      createCanvas(canvasWidth, canvasHeight);
      
      trackCenterX = width / 2;
      trackCenterY = height / 2 + 10;

      brainChef = new BrainChef(trackCenterX, trackCenterY - trackRadiusY - 50);
      customer = new Customer(trackCenterX, trackCenterY + trackRadiusY + 50);

      createMenuUI();
      createInGameUI();
      createActionButtonsUI();
    }

    function windowResized() {
      // Keep internal canvas resolution constant for precise coordinate mapping,
      // CSS object-fit/width/height scales it seamlessly across any display size.
    }

    function draw() {
      if (modeSelectScreen) {
        drawModeSelectionScreen();
        return;
      }

      if (frameCount % 45 === 0) {
        energyMeter = min(100, energyMeter + 0.5);
      }

      drawSimpleRestaurantBackground();
      drawOvalTrack();
      drawUI();

      if (frameCount - lastSpawnTime > 320 && plates.length < maxThoughtsOnTrack) {
        plates.push(new ThoughtPlate(getRandomThought(), getRandomSushi(), 0.75)); 
        lastSpawnTime = frameCount;
      }

      brainChef.update();
      brainChef.show();

      customer.update();
      customer.show();

      for (let i = plates.length - 1; i >= 0; i--) {
        plates[i].update();
        plates[i].show();
        if (plates[i].isFinished()) {
          plates.splice(i, 1);
        }
      }
    }

    function mousePressed() {
      if (modeSelectScreen) return;
      
      for (let i = plates.length - 1; i >= 0; i--) {
        if (plates[i].isClicked()) {
          if (customer.selectedThought === null) {
            customer.pickThought(plates[i]);
            plates.splice(i, 1);
            break;
          }
        }
      }
    }

    function keyPressed() {
      if (modeSelectScreen) return;

      if (key === 'i' || key === 'I') {
        actionInspectNearest();
      } else if (key === 'f' || key === 'F' || key === 'p' || key === 'P') {
        actionFightPush();
      } else if (key === 'l' || key === 'L') {
        actionLetGo();
      }
    }

    function actionInspectNearest() {
      if (customer.selectedThought !== null) return;
      let closestPlate = null;
      let closestDist = 9999;
      
      for (let p of plates) {
        let d = dist(p.x, p.y, customer.x, customer.y);
        if (d < closestDist) {
          closestDist = d;
          closestPlate = p;
        }
      }

      if (closestPlate && closestDist < 160) {
        customer.pickThought(closestPlate);
        let index = plates.indexOf(closestPlate);
        if (index > -1) plates.splice(index, 1);
      }
    }

    function actionFightPush() {
      flexibilityScore = max(0, flexibilityScore - 8);
      energyMeter = max(0, energyMeter - 12);
      customer.triggerFightPushAnimation();
      
      if (customer.selectedThought !== null) {
        customer.selectedThought.reverseDirection();
        plates.push(customer.selectedThought);
        customer.selectedThought = null;
      } else if (plates.length > 0) {
        let closestIndex = 0;
        let closestDist = 9999;
        for (let i = 0; i < plates.length; i++) {
          let d = dist(plates[i].x, plates[i].y, customer.x, customer.y);
          if (d < closestDist) {
            closestDist = d;
            closestIndex = i;
          }
        }
        if (closestDist < 180) {
          plates[closestIndex].reverseDirection();
        }
      }
    }

    function actionLetGo() {
      flexibilityScore = min(100, flexibilityScore + 3);
      customer.triggerLetGoAnimation();

      if (customer.selectedThought !== null) {
        customer.selectedThought.resumeDirection();
        plates.push(customer.selectedThought);
        customer.selectedThought = null;
      }
    }

    function createMenuUI() {
      inputField = createInput('');
      inputField.attribute('placeholder', 'Type your personal thought...');
      inputField.size(280, 32);
      inputField.position(windowWidth / 2 - 140, windowHeight / 2 - 10);
      
      submitButton = createButton('Start Game');
      submitButton.size(140, 36);
      submitButton.position(windowWidth / 2 - 70, windowHeight / 2 + 35);
      submitButton.mousePressed(addCustomThoughtAndStart);

      randomModeButton = createButton('Use Default Thoughts');
      randomModeButton.size(210, 36);
      randomModeButton.position(windowWidth / 2 - 105, windowHeight / 2 + 82);
      randomModeButton.mousePressed(startRandomMode);

      inputField.show();
      submitButton.show();
      randomModeButton.show();
    }

    function createInGameUI() {
      inGameInputField = createInput('');
      inGameInputField.attribute('placeholder', 'Type a thought...');
      inGameInputField.size(150, 26);
      inGameInputField.position(windowWidth / 2 - 160, windowHeight / 2 + 235);
      inGameInputField.hide();

      inGameSubmitButton = createButton('Add & Spawn');
      inGameSubmitButton.size(100, 28);
      inGameSubmitButton.position(windowWidth / 2 + 5, windowHeight / 2 + 234);
      inGameSubmitButton.mousePressed(addInGameThought);
      inGameSubmitButton.hide();
    }

    function createActionButtonsUI() {
      btnInspect = createButton('[I] Inspect');
      btnInspect.size(90, 28);
      btnInspect.position(windowWidth / 2 - 140, windowHeight / 2 + 272);
      btnInspect.mousePressed(actionInspectNearest);
      btnInspect.hide();

      btnFightPush = createButton('[F] Fight');
      btnFightPush.size(90, 28);
      btnFightPush.position(windowWidth / 2 - 45, windowHeight / 2 + 272);
      btnFightPush.mousePressed(actionFightPush);
      btnFightPush.hide();

      btnLetGo = createButton('[L] Let Go');
      btnLetGo.size(90, 28);
      btnLetGo.position(windowWidth / 2 + 50, windowHeight / 2 + 272);
      btnLetGo.mousePressed(actionLetGo);
      btnLetGo.hide();
    }

    function addCustomThoughtAndStart() {
      let val = inputField.value().trim();
      if (val.length > 0) {
        customThoughts.push(val);
      }
      inputField.value('');
      modeSelectScreen = false;
      hideMenuUI();
    }

    function startRandomMode() {
      modeSelectScreen = false;
      hideMenuUI();
    }

    function addInGameThought() {
      let val = inGameInputField.value().trim();
      if (val.length > 0) {
        customThoughts.push(val);
        // Spawn immediately onto the track at the Brain Chef position (progress 0.75)
        plates.push(new ThoughtPlate("'" + val + "'", getRandomSushi(), 0.75));
        inGameInputField.value('');
      }
    }

    function hideMenuUI() {
      if (inputField) inputField.hide();
      if (submitButton) submitButton.hide();
      if (randomModeButton) randomModeButton.hide();
      if (inGameInputField) inGameInputField.show();
      if (inGameSubmitButton) inGameSubmitButton.show();
      if (btnInspect) btnInspect.show();
      if (btnFightPush) btnFightPush.show();
      if (btnLetGo) btnLetGo.show();
    }

    function drawModeSelectionScreen() {
      background(18, 15, 20);

      fill(26, 22, 28);
      stroke(50, 42, 52);
      strokeWeight(2);
      rect(width / 2 - 280, 70, 560, 460, 12);

      noStroke();
      fill(255, 225, 195);
      textSize(18);
      textAlign(CENTER, TOP);
      text("🍣 THE MIND'S SUSHI RESTAURANT 🍣", width / 2, 95);

      textSize(12);
      fill(185, 195, 215);
      text("Thoughts flow slowly from the Brain Chef.\nInspect, Fight [F], or Let Go [L].\nYour energy restores automatically.", width / 2, 138);

      textSize(13);
      fill(255, 185, 100);
      text("Enter a personal thought to begin:", width / 2, 215);
    }

    function drawSimpleRestaurantBackground() {
      // Cozy, clean restaurant wood panel background
      background(30, 24, 28);

      // Simple horizontal wooden planks/lines
      stroke(38, 30, 35);
      strokeWeight(1);
      for (let y = 0; y < height; y += 50) {
        line(0, y, width, y);
      }

      // Warm central table floor inside the sushi belt track
      noStroke();
      fill(22, 18, 22);
      ellipse(trackCenterX, trackCenterY, trackRadiusX * 1.55, trackRadiusY * 1.55);
    }

    function drawOvalTrack() {
      noFill();
      stroke(15, 12, 15);
      strokeWeight(38);
      ellipse(trackCenterX, trackCenterY, trackRadiusX * 2, trackRadiusY * 2);

      noFill();
      stroke(52, 40, 48);
      strokeWeight(28);
      ellipse(trackCenterX, trackCenterY, trackRadiusX * 2, trackRadiusY * 2);

      noFill();
      stroke(22, 18, 22);
      strokeWeight(20);
      ellipse(trackCenterX, trackCenterY, trackRadiusX * 2, trackRadiusY * 2);

      trackProgressOffset += 0.0006;
      stroke(65, 50, 60);
      strokeWeight(2);
      for (let a = 0; a < TWO_PI; a += QUARTER_PI) {
        let t = a + trackProgressOffset;
        let x1 = trackCenterX + cos(t) * (trackRadiusX - 9);
        let y1 = trackCenterY + sin(t) * (trackRadiusY - 9);
        let x2 = trackCenterX + cos(t) * (trackRadiusX + 9);
        let y2 = trackCenterY + sin(t) * (trackRadiusY + 9);
        line(x1, y1, x2, y2);
      }
    }

    function drawUI() {
      // Clean, well-spaced top status HUD bar
      fill(16, 13, 16, 245);
      noStroke();
      rect(0, 0, width, 45);

      fill(255);
      textSize(12);
      textStyle(BOLD);
      textAlign(LEFT, CENTER);
      text("🍣 SUSHI RESTAURANT", 25, 22);
      textStyle(NORMAL);

      // Flexibility Bar
      text("Flex:", 220, 22);
      fill(40, 40, 48);
      rect(260, 15, 90, 14, 5);
      fill(90, 215, 150);
      rect(260, 15, map(flexibilityScore, 0, 100, 0, 90), 14, 5);

      // Energy Bar
      fill(255);
      text("Energy:", 385, 22);
      fill(40, 40, 48);
      rect(435, 15, 90, 14, 5);
      fill(235, 175, 75);
      rect(435, 15, map(energyMeter, 0, 100, 0, 90), 14, 5);
    }

    class BrainChef {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.animTimer = 0;
      }
      update() { this.animTimer += 0.03; }
      show() {
        noStroke();
        fill(255);
        rectMode(CENTER);
        rect(this.x, this.y - 22, 28, 14, 3);
        rect(this.x, this.y - 30, 20, 9, 3);
        fill(255, 160, 180);
        ellipse(this.x, this.y - 4, 42, 30);
      }
    }

    class Customer {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.selectedThought = null;
        this.timer = 0;
        this.actionAnimTimer = 0;
        this.actionType = "";
      }
      pickThought(plate) {
        this.selectedThought = plate;
        this.timer = 240;
      }
      triggerFightPushAnimation() {
        this.actionAnimTimer = 22;
        this.actionType = "FIGHT!";
      }
      triggerLetGoAnimation() {
        this.actionAnimTimer = 22;
        this.actionType = "LET GO";
      }
      update() {
        if (this.selectedThought !== null) {
          this.timer--;
          if (this.timer <= 0) this.selectedThought = null;
        }
        if (this.actionAnimTimer > 0) this.actionAnimTimer--;
      }
      show() {
        noStroke();
        if (this.actionAnimTimer > 0) {
          fill(255, 110, 130, 190);
          ellipse(this.x, this.y - 20, 42, 26);
          fill(255);
          textSize(9);
          textStyle(BOLD);
          textAlign(CENTER, CENTER);
          text(this.actionType, this.x, this.y - 20);
          textStyle(NORMAL);
        }
        fill(235, 200, 175);
        ellipse(this.x, this.y - 6, 18, 18);
        fill(65, 100, 150);
        rectMode(CENTER);
        rect(this.x, this.y + 10, 24, 20, 4);

        if (this.selectedThought !== null) {
          fill(245, 248, 255);
          stroke(160, 180, 205);
          strokeWeight(1);
          rect(this.x, this.y - 36, 130, 22, 4);
          noStroke();
          fill(20, 25, 35);
          textSize(10);
          textStyle(BOLD);
          textAlign(CENTER, CENTER);
          text(this.selectedThought.sushiType + " " + this.selectedThought.label, this.x, this.y - 36);
          textStyle(NORMAL);
        }
      }
    }

    class ThoughtPlate {
      constructor(label, sushiType, progress) {
        this.progress = progress;
        this.speed = 0.0012;
        this.label = label;
        this.sushiType = sushiType;
        this.w = 120;
        this.h = 22;
        this.updateCoordinates();
      }
      updateCoordinates() {
        let angle = this.progress * TWO_PI;
        this.x = trackCenterX + cos(angle) * trackRadiusX;
        this.y = trackCenterY + sin(angle) * trackRadiusY;
      }
      update() {
        this.progress += this.speed;
        this.updateCoordinates();
      }
      reverseDirection() { this.speed = -0.002; }
      resumeDirection() { this.speed = 0.0012; }
      show() {
        fill(245, 248, 255);
        stroke(155, 175, 200);
        strokeWeight(1);
        ellipse(this.x, this.y, this.w + 5, this.h + 3);
        fill(228, 236, 248);
        rectMode(CENTER);
        rect(this.x, this.y, this.w, this.h, 4);
        noStroke();
        fill(22, 28, 38);
        textSize(10);
        textStyle(BOLD);
        textAlign(CENTER, CENTER);
        text(this.sushiType + " " + this.label, this.x, this.y);
        textStyle(NORMAL);
      }
      isClicked() {
        let d = dist(mouseX, mouseY, this.x, this.y);
        return (d < this.w / 2);
      }
      isFinished() { return false; }
    }

    function getRandomThought() {
      if (customThoughts.length > 0 && random() < 0.5) {
        return "'" + random(customThoughts) + "'";
      } else {
        let allThoughtsPool = [
          "'I am falling behind'",
          "'Everyone is judging me'",
          "'I can't handle this'",
          "'What if I mess up?'",
          "'The floor is wooden'",
          "'It is 3 o clock'",
          "'I need water'",
          "'My chair is comfy'"
        ];
        return random(allThoughtsPool);
      }
    }

    function getRandomSushi() {
      return random(["🍣", "🍤", "🍱", "🍥", "🍙", "🍵", "🍡"]);
    }
  </script>
</body>
</html>
